{% extends 'partials/sidebar_base.html' %}

{% block content %}
<div class="container mt-4">

    <h2>Editar usuario</h2>
    <p>Modifica la información y el rol del usuario seleccionado.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="username" class="form-label">Nombre de usuario</label>
            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                value="{{ usuario.username }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ usuario.email }}"
            >
        </div>

        <div class="mb-3">
            <label for="first_name" class="form-label">Nombre</label>
            <input
                type="text"
                class="form-control"
                id="first_name"
                name="first_name"
                value="{{ usuario.first_name }}"
            >
        </div>

        <div class="mb-3">
            <label for="apellido_paterno" class="form-label">Apellido paterno</label>
            <input
                type="text"
                class="form-control"
                id="apellido_paterno"
                name="apellido_paterno"
                value="{{ perfil.apellido_paterno }}"
            >
        </div>

        <div class="mb-3">
            <label for="apellido_materno" class="form-label">Apellido materno</label>
            <input
                type="text"
                class="form-control"
                id="apellido_materno"
                name="apellido_materno"
                value="{{ perfil.apellido_materno }}"
            >
        </div>

        <div class="mb-3">
            <label for="rol" class="form-label">Rol del usuario</label>
            <select class="form-select" id="rol" name="rol" required>

                <option value="colaborador"
                    {% if not usuario.is_staff %}
                        selected
                    {% endif %}>
                    Colaborador
                </option>

                <option value="editor"
                    {% if usuario.is_staff and not usuario.is_superuser %}
                        selected
                    {% endif %}>
                    Editor
                </option>

                <option value="administrador"
                    {% if usuario.is_superuser %}
                        selected
                    {% endif %}>
                    Administrador
                </option>

            </select>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Guardar cambios
            </button>

            <a href="{% url 'home:crud_usuarios' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>

</div>
{% endblock %}
